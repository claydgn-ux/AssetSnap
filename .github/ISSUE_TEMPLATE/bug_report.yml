name: Bug report
description: Report a reproducible AssetSnap problem
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an AssetSnap issue. Please avoid including private URLs, login credentials, cookies, or other sensitive data.
  - type: input
    id: version
    attributes:
      label: AssetSnap version
      placeholder: AssetSnap_v0.2.0-CL
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 140 / Edge 140
    validations:
      required: true
  - type: input
    id: tampermonkey
    attributes:
      label: Tampermonkey version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the shortest path that reproduces the problem.
      placeholder: |
        1. Open ...
        2. Hover ...
        3. Press D and click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional information
      description: Screenshots are welcome. Do not paste passwords, cookies or private tokens.
